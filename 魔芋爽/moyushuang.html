```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>卫龙魔芋爽商城</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, "Microsoft YaHei", sans-serif;
}

body {
    background: #f7f7f7;
    color: #222;
}

/* ===== 顶部导航 ===== */

header {
    background: #e60012;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 30px;
    font-weight: bold;
}

.logo span {
    color: #ffd400;
}

.cart-btn {
    background: white;
    color: #e60012;
    border: none;
    padding: 12px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

/* ===== Banner ===== */

.banner {
    background: linear-gradient(
        135deg,
        #e60012,
        #ff3b30
    );

    min-height: 420px;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
    color: white;

    padding: 40px 20px;
}

.banner h1 {
    font-size: 60px;
    margin-bottom: 15px;
}

.banner h1 span {
    color: #ffd400;
}

.banner p {
    font-size: 21px;
}

.banner button {
    margin-top: 25px;
    padding: 14px 30px;
    border: none;
    border-radius: 30px;
    background: #ffd400;
    color: #111;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

/* ===== 商品区域 ===== */

.container {
    max-width: 1200px;
    margin: 50px auto;
    padding: 0 20px;
}

.title {
    text-align: center;
    margin-bottom: 35px;
}

.title h2 {
    font-size: 36px;
}

.title p {
    color: #777;
    margin-top: 8px;
}

/* 商品网格 */

.products {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(240px, 1fr));

    gap: 25px;
}

/* 商品卡片 */

.product {
    background: white;
    border-radius: 18px;
    overflow: hidden;

    box-shadow:
        0 5px 20px rgba(0,0,0,.08);

    transition: .3s;
}

.product:hover {
    transform: translateY(-7px);
}

/* 商品图片 */

.product-img {
    height: 230px;

    background:
        linear-gradient(
            135deg,
            #ffe8e8,
            #fff
        );

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 90px;
}

.product-info {
    padding: 20px;
}

.product-info h3 {
    font-size: 22px;
    margin-bottom: 8px;
}

.flavor {
    color: #777;
    font-size: 14px;
    margin-bottom: 10px;
}

.price {
    color: #e60012;
    font-size: 25px;
    font-weight: bold;
    margin: 15px 0;
}

.add {
    width: 100%;
    padding: 13px;

    background: #e60012;
    color: white;

    border: none;
    border-radius: 9px;

    font-size: 16px;
    cursor: pointer;
}

.add:hover {
    background: #c90010;
}

/* ===== 购物车 ===== */

.cart {
    position: fixed;

    top: 0;
    right: -430px;

    width: 410px;
    max-width: 100%;

    height: 100vh;

    background: white;

    z-index: 999;

    padding: 25px;

    box-shadow:
        -5px 0 25px rgba(0,0,0,.2);

    transition: .4s;

    overflow-y: auto;
}

.cart.open {
    right: 0;
}

.cart-head {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 25px;
}

.close {
    font-size: 28px;
    cursor: pointer;
}

.cart-item {
    border-bottom: 1px solid #ddd;
    padding: 15px 0;
}

.cart-item-top {
    display: flex;
    justify-content: space-between;
}

.qty {
    margin-top: 10px;

    display: flex;
    align-items: center;

    gap: 10px;
}

.qty button {
    width: 28px;
    height: 28px;

    border: none;
    border-radius: 5px;

    background: #e60012;
    color: white;

    cursor: pointer;
}

.total {
    margin-top: 25px;

    font-size: 25px;
    font-weight: bold;
}

.checkout {
    width: 100%;

    margin-top: 20px;

    padding: 15px;

    background: #ffd400;

    border: none;
    border-radius: 10px;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}

/* ===== 下单 ===== */

.order-form {
    display: none;

    margin-top: 20px;
}

.order-form.show {
    display: block;
}

.order-form input,
.order-form textarea {
    width: 100%;

    padding: 12px;

    margin: 7px 0;

    border: 1px solid #ddd;

    border-radius: 7px;
}

.submit {
    width: 100%;

    padding: 14px;

    background: #e60012;

    color: white;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    font-size: 16px;
}

/* ===== Footer ===== */

footer {
    margin-top: 80px;

    padding: 35px;

    background: #222;

    color: white;

    text-align: center;
}

footer span {
    color: #ffd400;
}

/* ===== 手机 ===== */

@media(max-width:600px) {

    .banner h1 {
        font-size: 42px;
    }

    .banner p {
        font-size: 16px;
    }

    .logo {
        font-size: 23px;
    }

    .cart {
        width: 100%;
    }
}
</style>
</head>


<body>


<!-- ==================== HEADER ==================== -->

<header>

    <div class="logo">
        卫龙<span>魔芋爽</span>
    </div>

    <button
        class="cart-btn"
        onclick="openCart()">

        🛒 购物车
        (<span id="cartCount">0</span>)

    </button>

</header>


<!-- ==================== BANNER ==================== -->

<section class="banner">

    <div>

        <h1>
            卫龙<span>魔芋爽</span>
        </h1>

        <p>
            Q弹爽口 · 香辣过瘾 · 一口停不下来
        </p>

        <button
            onclick="scrollToProducts()">

            立即选购

        </button>

    </div>

</section>


<!-- ==================== PRODUCTS ==================== -->

<section
    class="container"
    id="products">

    <div class="title">

        <h2>魔芋爽系列</h2>

        <p>
            选择你喜欢的口味
        </p>

    </div>


    <div
        class="products"
        id="productList">

    </div>

</section>


<!-- ==================== CART ==================== -->

<div
    class="cart"
    id="cart">

    <div class="cart-head">

        <h2>🛒 我的购物车</h2>

        <span
            class="close"
            onclick="closeCart()">

            ×

        </span>

    </div>


    <div id="cartItems">

        <p>
            购物车还是空的
        </p>

    </div>


    <div class="total">

        总计：
        RM <span id="total">0.00</span>

    </div>


    <button
        class="checkout"
        onclick="showOrder()">

        立即下单

    </button>


    <!-- 下单表格 -->

    <div
        class="order-form"
        id="orderForm">

        <h3>
            📦 填写订单资料
        </h3>

        <input
            id="name"
            placeholder="姓名">

        <input
            id="phone"
            placeholder="电话号码">

        <textarea
            id="address"
            rows="4"
            placeholder="收货地址">
        </textarea>

        <button
            class="submit"
            onclick="submitOrder()">

            提交订单

        </button>

    </div>

</div>


<!-- ==================== FOOTER ==================== -->

<footer>

    <p>
        © 2026
        <span>卫龙魔芋爽</span>
        商品展示网站
    </p>

    <p style="margin-top:10px;">
        Q弹魔芋 · 香辣爽口
    </p>

</footer>


<script>

/* =========================================
   商品资料
========================================= */

const products = [

    {
        id: 1,
        name: "魔芋爽",
        flavor: "香辣味",
        price: 3.90,
        emoji: "🌶️"
    },

    {
        id: 2,
        name: "魔芋爽",
        flavor: "麻辣味",
        price: 3.90,
        emoji: "🔥"
    },

    {
        id: 3,
        name: "魔芋爽",
        flavor: "酸辣味",
        price: 3.90,
        emoji: "🌶️"
    },

    {
        id: 4,
        name: "魔芋爽",
        flavor: "藤椒味",
        price: 3.90,
        emoji: "🌿"
    },

    {
        id: 5,
        name: "魔芋爽",
        flavor: "香卤味",
        price: 3.90,
        emoji: "🥢"
    },

    {
        id: 6,
        name: "魔芋爽",
        flavor: "泡椒味",
        price: 3.90,
        emoji: "🌶️"
    },

    {
        id: 7,
        name: "魔芋爽",
        flavor: "红油味",
        price: 3.90,
        emoji: "🔥"
    },

    {
        id: 8,
        name: "魔芋爽",
        flavor: "麻酱味",
        price: 4.50,
        emoji: "🥜"
    }

];


/* =========================================
   购物车
========================================= */

let cart = [];


/* =========================================
   显示商品
========================================= */

function renderProducts() {

    const list =
        document.getElementById(
            "productList"
        );

    list.innerHTML = "";

    products.forEach(product => {

        list.innerHTML += `

        <div class="product">

            <div class="product-img">

                ${product.emoji}

            </div>

            <div class="product-info">

                <h3>
                    ${product.name}
                </h3>

                <div class="flavor">

                    口味：
                    ${product.flavor}

                </div>

                <div class="price">

                    RM
                    ${product.price.toFixed(2)}

                </div>

                <button
                    class="add"
                    onclick="addToCart(${product.id})">

                    ＋ 加入购物车

                </button>

            </div>

        </div>

        `;

    });

}


/* =========================================
   加入购物车
========================================= */

function addToCart(id) {

    const product =
        products.find(
            p => p.id === id
        );

    const existing =
        cart.find(
            p => p.id === id
        );

    if (existing) {

        existing.quantity++;

    } else {

        cart.push({

            ...product,

            quantity: 1

        });

    }

    updateCart();

}


/* =========================================
   更新购物车
========================================= */

function updateCart() {

    const cartItems =
        document.getElementById(
            "cartItems"
        );

    const cartCount =
        document.getElementById(
            "cartCount"
        );

    const total =
        document.getElementById(
            "total"
        );

    let totalPrice = 0;

    let totalQuantity = 0;


    if (cart.length === 0) {

        cartItems.innerHTML =
            "<p>购物车还是空的</p>";

    } else {

        cartItems.innerHTML = "";

        cart.forEach(item => {

            totalPrice +=
                item.price *
                item.quantity;

            totalQuantity +=
                item.quantity;


            cartItems.innerHTML += `

            <div class="cart-item">

                <div class="cart-item-top">

                    <strong>
                        ${item.flavor}
                    </strong>

                    <span>
                        RM
                        ${(item.price *
                        item.quantity)
                        .toFixed(2)}
                    </span>

                </div>

                <div class="qty">

                    <button
                        onclick="changeQty(
                            ${item.id},
                            -1
                        )">

                        −

                    </button>

                    <span>
                        ${item.quantity}
                    </span>

                    <button
                        onclick="changeQty(
                            ${item.id},
                            1
                        )">

                        +

                    </button>

                </div>

            </div>

            `;

        });

    }


    cartCount.innerText =
        totalQuantity;

    total.innerText =
        totalPrice.toFixed(2);

}


/* =========================================
   修改数量
========================================= */

function changeQty(id, amount) {

    const item =
        cart.find(
            p => p.id === id
        );

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {

        cart =
            cart.filter(
                p => p.id !== id
            );

    }

    updateCart();

}


/* =========================================
   打开购物车
========================================= */

function openCart() {

    document
        .getElementById("cart")
        .classList
        .add("open");

}


/* =========================================
   关闭购物车
========================================= */

function closeCart() {

    document
        .getElementById("cart")
        .classList
        .remove("open");

}


/* =========================================
   显示订单表格
========================================= */

function showOrder() {

    if (cart.length === 0) {

        alert(
            "请先选择商品！"
        );

        return;

    }

    document
        .getElementById("orderForm")
        .classList
        .add("show");

}


/* =========================================
   提交订单
========================================= */

function submitOrder() {

    const name =
        document.getElementById(
            "name"
        ).value;

    const phone =
        document.getElementById(
            "phone"
        ).value;

    const address =
        document.getElementById(
            "address"
        ).value;


    if (
        name === "" ||
        phone === "" ||
        address === ""
    ) {

        alert(
            "请完整填写订单资料！"
        );

        return;

    }


    let total = 0;

    cart.forEach(item => {

        total +=
            item.price *
            item.quantity;

    });


    alert(

        "订单提交成功！\n\n" +

        "顾客：" +
        name +
        "\n" +

        "电话：" +
        phone +
        "\n\n" +

        "订单金额：RM " +
        total.toFixed(2)

    );


    cart = [];

    updateCart();

    document
        .getElementById("orderForm")
        .classList
        .remove("show");

}


/* =========================================
   滚动到商品
========================================= */

function scrollToProducts() {

    document
        .getElementById("products")
        .scrollIntoView({
            behavior: "smooth"
        });

}


/* 初始化 */

renderProducts();

updateCart();

</script>

</body>
</html>
```
